<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Imágenes - Catálogo MIA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            margin: 0;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #78BE20;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .product-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-image {
            width: 100%;
            height: 250px;
            object-fit: contain;
            background: white;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .product-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #78BE20;
        }
        .product-info {
            font-size: 14px;
            line-height: 1.6;
        }
        .product-info span {
            display: block;
            margin-bottom: 5px;
        }
        .brand {
            color: #FFD700;
            font-weight: bold;
        }
        .price {
            color: #78BE20;
            font-size: 18px;
            font-weight: bold;
        }
        .reviews {
            color: #FFA500;
        }
        .verdict {
            text-align: center;
            margin-top: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }
        .verdict h2 {
            color: #78BE20;
            margin-bottom: 20px;
        }
        .verdict-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .verdict-button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-yes {
            background: #78BE20;
            color: #000;
        }
        .btn-yes:hover {
            background: #92d235;
            transform: scale(1.05);
        }
        .btn-no {
            background: #dc3545;
            color: #fff;
        }
        .btn-no:hover {
            background: #c82333;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Verificación de Imágenes del Catálogo</h1>
        
        <div class="product-grid" id="productGrid"></div>
        
        <div class="verdict">
            <h2>¿Las imágenes corresponden con los productos?</h2>
            <p style="font-size: 16px; margin-bottom: 20px;">
                Si las imágenes son correctas y coinciden con los nombres de los productos,<br>
                usaremos este catálogo con 546 productos con fotos reales.
            </p>
            <div class="verdict-buttons">
                <button class="verdict-button btn-yes" onclick="alert('✅ Perfecto! Usaremos este catálogo con imágenes reales.')">
                    ✅ SÍ, son correctas
                </button>
                <button class="verdict-button btn-no" onclick="alert('❌ OK, seguiremos con los logos de marca.')">
                    ❌ NO, prefiero logos
                </button>
            </div>
        </div>
    </div>

    <script>
        const productos = [
            {
                name: "Foco downlight INSPIRE LED redondo blanco 3100 lm",
                id: "LM-91336224",
                brand: "INSPIRE",
                category: "Iluminación",
                price: 11.99,
                reviews: 141,
                image: "https://media.adeo.com/marketplace/LMES/84637886/foco-downlight-inspire-led-redondo-blanco-3100-lm.jpeg"
            },
            {
                name: "10 tacos + tornillos FISCHER SX Plus ø10mm L.50mm",
                id: "LM-88016233",
                brand: "FISCHER",
                category: "Ferretería",
                price: 6.49,
                reviews: 25,
                image: "https://media.adeo.com/marketplace/LMES/84492816/10-tacos-tornillos-fischer-sx-plus-10mm-l-50mm.jpeg"
            },
            {
                name: "Grifo bañera monomando Nerea cromado",
                id: "LM-64292522",
                brand: "SENSEA",
                category: "Baño",
                price: 19.25,
                reviews: 434,
                image: "https://media.adeo.com/marketplace/LMES/13766169/grifo-banera-monomando-nerea-cromado.jpeg"
            },
            {
                name: "Taladro percutor sin escobillas BLACK+DECKER 18V batería 1.5Ah",
                id: "LM-84454998",
                brand: "BLACK+DECKER",
                category: "Herramientas",
                price: 79.99,
                reviews: 128,
                image: "https://media.adeo.com/marketplace/LMES/78170682/taladro-percutor-black-decker-18v-bateria-1-5ah.jpeg"
            },
            {
                name: "Brocha DEXTER 50mm cerda natural",
                id: "LM-REAL-025",
                brand: "DEXTER",
                category: "Pintura",
                price: 3.95,
                reviews: 85,
                image: "https://media.adeo.com/marketplace/LMES/82068898/16858342.jpeg"
            },
            {
                name: "Taladro percutor BOSCH Professional GSB 13 RE 600W",
                id: "LM-17840296",
                brand: "BOSCH",
                category: "Herramientas",
                price: 89.99,
                reviews: 312,
                image: "https://media.adeo.com/marketplace/LMES/83551044/taladro-percutor-bosch-professional-gsb-13-re-600w.jpeg"
            },
            {
                name: "Lámpara LED PHILIPS de techo 12W 4000K",
                id: "LM-82456789",
                brand: "PHILIPS",
                category: "Iluminación",
                price: 24.99,
                reviews: 89,
                image: "https://media.adeo.com/marketplace/LMES/84532112/lampara-led-philips-de-techo-12w-4000k.jpeg"
            },
            {
                name: "Sierra circular DEWALT DWE575K 1600W",
                id: "LM-85632147",
                brand: "DEWALT",
                category: "Herramientas",
                price: 189.99,
                reviews: 156,
                image: "https://media.adeo.com/marketplace/LMES/82147852/sierra-circular-dewalt-dwe575k-1600w.jpeg"
            }
        ];

        const grid = document.getElementById('productGrid');
        
        productos.forEach(producto => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${producto.image}" alt="${producto.name}" class="product-image" 
                     onerror="this.src='https://via.placeholder.com/250x250?text=Imagen+no+disponible'">
                <div class="product-name">${producto.name}</div>
                <div class="product-info">
                    <span class="brand">🏷️ ${producto.brand}</span>
                    <span>📦 ${producto.category}</span>
                    <span class="price">💰 ${producto.price.toFixed(2)}€</span>
                    <span class="reviews">⭐ ${producto.reviews} valoraciones</span>
                    <span style="font-size: 12px; color: #999;">ID: ${producto.id}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
